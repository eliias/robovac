[tools]
node = "24"

[tasks.dev]
description = "Start the next dev server"
run = "npm run dev"

[tasks.build]
description = "Build the app and the mcp package"
run = ["npm run build", "npm run build --workspace=robovac-mcp"]

[tasks.test]
description = "Run the vitest suite"
run = "npm test"

[tasks.lint]
description = "Lint with oxlint"
run = "npm run lint"

[tasks.fmt]
description = "Format with oxfmt"
run = "npm run format"

[tasks.check]
description = "Everything CI would run: format check, lint, tests, builds"
depends = ["lint", "test", "build"]
run = "npm run format:check"
