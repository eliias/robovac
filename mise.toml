[tools]
node = "24"
pnpm = "10"

[tasks.dev]
description = "Start the next dev server"
run = "pnpm run dev"

[tasks.build]
description = "Build the app"
run = "pnpm run build"

[tasks.test]
description = "Run the vitest suite"
run = "pnpm test"

[tasks.lint]
description = "Lint with oxlint"
run = "pnpm run lint"

[tasks.fmt]
description = "Format with oxfmt"
run = "pnpm run format"

[tasks.check]
description = "Everything CI would run: format check, lint, tests, builds"
depends = ["lint", "test", "build"]
run = "pnpm run format:check"
